name: Dados da RAIS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/data.yml
      - .dvc/config
      - .dvcignore
      - config/**
      - data/**
      - src/rais_*.py
      - src/salarios.py
      - pyproject.toml
      - uv.lock

permissions:
  contents: read

concurrency:
  group: dados-rais-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agregados:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --dev
      - name: Baixar artefatos rastreados
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Configure AWS_ACCESS_KEY_ID e AWS_SECRET_ACCESS_KEY com as credenciais S3 do DagsHub."
            exit 1
          fi
          uv run --locked dvc pull \
            data/processed/rais_stem_2025_brasil.parquet.dvc \
            data/processed/rais_stem_2025_brasil.json.dvc
      - name: Conferir tabelas agregadas
        run: |
          uv run --locked python -m src.salarios gerar --ano 2025
          git diff --exit-code -- data/agregados/
          test -z "$(git ls-files --others --exclude-standard -- data/agregados/)"
