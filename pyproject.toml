[project]
name = "artemishub-agents"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "artemishub-rag",
    "langchain-openai>=1.8.3",
    "langfuse>=5.2.0",
    "langgraph>=1.2.23",
    "pandas>=3.1.1",
    "py7zr>=1.1.4",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "dvc[s3]>=3.67.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv.sources]
artemishub-rag = { git = "https://github.com/ArtemisHubApp/artemishub_rag", rev = "a4eb635f9c62b4749fff09ac2da6fa82d061a926" }
